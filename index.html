<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>🧵 Бирки кроя — Спецназ 22</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f2ea;
            color: #1c2b22;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== БРЕНДИНГ ===== */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 3px solid #1c2b22;
            padding-bottom: 10px;
            margin-bottom: 6px;
        }
        .brand-header .logo {
            font-size: 32px;
        }
        .brand-header .title-group h1 {
            font-size: 26px;
            font-family: Georgia, serif;
        }
        .brand-header .title-group .brand-sub {
            font-size: 11px;
            letter-spacing: 2px;
            color: #7a8f7a;
            text-transform: uppercase;
        }
        .brand-header .title-group .brand-sub span {
            color: #b5432a;
            font-weight: bold;
        }
        .sub {
            font-size: 13px;
            color: #7a8f7a;
            margin-bottom: 16px;
        }

        /* ===== КАРТОЧКИ ===== */
        .card {
            background: white;
            border: 1px solid #c9c3b3;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a8f7a;
            margin-bottom: 10px;
        }

        /* ===== ПОЛЯ ВВОДА ===== */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a8f7a;
        }
        .field input,
        .field select {
            font-size: 15px;
            padding: 10px 12px;
            border: 1px solid #c9c3b3;
            border-radius: 6px;
            background: #fffef9;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }
        .field input:focus,
        .field select:focus {
            outline: 2px solid #b5432a;
            outline-offset: 2px;
        }

        /* ===== КНОПКИ ===== */
        button {
            font-size: 15px;
            font-weight: 600;
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #1c2b22;
            background: #1c2b22;
            color: #f4f2ea;
            cursor: pointer;
            touch-action: manipulation;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        button.secondary {
            background: transparent;
            color: #1c2b22;
        }
        button.success {
            background: #2a5c3a;
            border-color: #2a5c3a;
            color: #fff;
        }
        button.danger {
            background: transparent;
            color: #b5432a;
            border-color: #b5432a;
        }
        button.info {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        button.small {
            font-size: 12px;
            padding: 5px 14px;
            width: auto;
            min-height: 34px;
            border-radius: 5px;
        }

        /* ===== КНОПКИ ВВЕРХУ ===== */
        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .top-actions button {
            flex: 1;
            min-width: 45%;
            font-size: 13px;
            padding: 10px 12px;
        }

        /* ===== БЛОК "ДАННЫЕ" ===== */
        .data-grid {
            display: table;
            width: 100%;
            border-collapse: collapse;
        }
        .data-row {
            display: table-row;
            border-bottom: 1px solid #f0f0ee;
        }
        .data-row:last-child {
            border-bottom: none;
        }

        .data-cell {
            display: table-cell;
            padding: 6px 0;
            vertical-align: middle;
        }
        .data-cell.left {
            width: 50%;
            padding-right: 12px;
        }
        .data-cell.right {
            width: 50%;
            text-align: right;
        }

        .data-label {
            font-size: 13px;
            color: #1c2b22;
            font-weight: 500;
            white-space: nowrap;
        }
        .data-count {
            font-size: 13px;
            color: #166534;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 4px;
        }
        .data-count.empty {
            color: #7a8f7a;
            font-weight: 400;
        }

        .data-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }
        .data-actions label {
            padding: 4px 14px;
            border: 1px solid #c9c3b3;
            border-radius: 5px;
            background: #fffef9;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
        }
        .data-actions label:active {
            background: #e5e5e5;
        }
        .data-actions input[type="file"] {
            display: none;
        }
        .data-actions button {
            padding: 4px 14px;
            font-size: 12px;
            width: auto;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            border-radius: 5px;
        }
        .data-actions button:active {
            opacity: 0.7;
        }

        /* ===== QR-КОД ===== */
        .qr-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .qr-row .field {
            flex: 1;
            min-width: 160px;
        }
        .qr-row .field label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a8f7a;
        }
        .qr-row .field input {
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #c9c3b3;
            border-radius: 6px;
            background: #fffef9;
            width: 100%;
        }
        .qr-row .field input:focus {
            outline: 2px solid #b5432a;
            outline-offset: 2px;
        }

        /* ===== БИРКИ ===== */
        .list-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a8f7a;
            margin: 20px 0 10px;
        }
        .empty {
            font-size: 14px;
            color: #7a8f7a;
            padding: 30px 0;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        .tag {
            position: relative;
            background: white;
            border: 1px solid #1c2b22;
            border-radius: 6px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .tag .qr {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 4px;
        }
        .tag .qr canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .tag .num {
            font-family: Georgia, serif;
            font-weight: 700;
            font-size: 16px;
        }
        .tag .meta {
            font-size: 11px;
            line-height: 1.5;
            color: #3d3d35;
            margin-top: 2px;
        }
        .tag .footer {
            font-size: 9px;
            color: #999;
            margin-top: 6px;
            border-top: 1px solid #eee;
            padding-top: 4px;
            width: 100%;
        }
        .tag .del-tag {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 14px;
            color: #b5432a;
            background: none;
            border: none;
            padding: 4px 6px;
            cursor: pointer;
            width: auto;
        }
        .tag .edit-tag {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 14px;
            color: #3b82f6;
            background: none;
            border: none;
            padding: 4px 6px;
            cursor: pointer;
            width: auto;
        }

        /* ===== ТАБЛИЦА ===== */
        .table-wrap {
            overflow-x: auto;
            margin-top: 8px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 500px;
        }
        .data-table th {
            background: #1c2b22;
            color: #f4f2ea;
            text-align: left;
            padding: 8px 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table .tag-num {
            font-weight: bold;
        }

        .brand-footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            margin-top: 25px;
            letter-spacing: 1px;
        }
        .brand-footer span {
            color: #b5432a;
            font-weight: bold;
        }

        /* ===== МОДАЛКА ===== */
        .edit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .edit-modal {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .edit-modal h3 {
            font-family: Georgia, serif;
            margin-bottom: 15px;
            border-bottom: 2px solid #1c2b22;
            padding-bottom: 8px;
        }
        .hidden {
            display: none !important;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .row .field {
            flex: 1;
            min-width: 120px;
        }

        @media print {
            body {
                background: white;
                padding: 10px;
            }
            .no-print {
                display: none !important;
            }
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
            .tag {
                border: 1px solid #999;
                break-inside: avoid;
            }
            .tag .del-tag,
            .tag .edit-tag {
                display: none !important;
            }
            .brand-footer {
                display: none !important;
            }
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 800px) {
            body {
                padding: 10px;
            }
            .brand-header .title-group h1 {
                font-size: 20px;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .field input,
            .field select {
                font-size: 16px;
                padding: 12px 14px;
            }
            button {
                font-size: 16px;
                padding: 14px 20px;
            }
            .top-actions button {
                min-width: 100%;
                font-size: 14px;
                padding: 12px 14px;
            }
            .card {
                padding: 14px 16px;
            }

            .data-cell.left {
                width: 45%;
                padding-right: 8px;
            }
            .data-cell.right {
                width: 55%;
            }

            .data-label {
                font-size: 14px;
            }
            .data-count {
                font-size: 14px;
            }
            .data-actions label {
                font-size: 13px;
                padding: 6px 14px;
                min-height: 38px;
            }
            .data-actions button {
                font-size: 13px;
                padding: 6px 14px;
                min-height: 38px;
            }

            .qr-row .field {
                min-width: 100%;
            }
            .qr-row .field input {
                font-size: 16px;
                padding: 12px 14px;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .brand-header .title-group h1 {
                font-size: 17px;
            }
            .data-cell.left {
                width: 40%;
                padding-right: 6px;
            }
            .data-cell.right {
                width: 60%;
            }
            .data-actions label {
                flex: 1;
                text-align: center;
                justify-content: center;
            }
            .data-actions button {
                flex: 1;
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">

        <!-- ===== БРЕНДИНГ ===== -->
        <div class="brand-header">
            <div class="logo">🧵</div>
            <div class="title-group">
                <h1>Бирки кроя</h1>
                <div class="brand-sub">Спецназ <span>22</span></div>
            </div>
        </div>
        <p class="sub">Категория → артикул → размер → бирка</p>

        <!-- ===== КНОПКИ ДЕЙСТВИЙ ===== -->
        <div class="top-actions no-print">
            <button class="success" id="pdfBtn">📄 PDF</button>
            <button class="secondary" id="printBtn">🖨 Печать</button>
            <button class="danger" id="clearBtn">🗑 Очистить</button>
            <button class="secondary" id="exportTagsBtn">📤 CSV</button>
            <button class="secondary" id="exportExcelBtn">📊 Excel</button>
        </div>

        <!-- ===== БЛОК "ДАННЫЕ" ===== -->
        <div class="card no-print">
            <div class="card-title">📁 Данные</div>

            <div class="data-grid">

                <!-- Артикулы -->
                <div class="data-row">
                    <div class="data-cell left">
                        <span class="data-label">Артикулы</span>
                        <span class="data-count empty" id="articlesCountDisplay">/ 0</span>
                    </div>
                    <div class="data-cell right">
                        <div class="data-actions">
                            <label for="articlesFile">📂 Загрузить</label>
                            <input type="file" id="articlesFile" accept=".csv">
                            <button class="small danger" id="resetArticlesBtn">Сброс</button>
                        </div>
                    </div>
                </div>

                <!-- Бирки -->
                <div class="data-row">
                    <div class="data-cell left">
                        <span class="data-label">Бирки</span>
                        <span class="data-count empty" id="tagsCountDisplay">/ 0</span>
                    </div>
                    <div class="data-cell right">
                        <div class="data-actions">
                            <label for="tagsFile">📂 Загрузить</label>
                            <input type="file" id="tagsFile" accept=".csv">
                            <button class="small danger" id="resetTagsBtn">Сброс</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ===== QR-КОД ===== -->
        <div class="card no-print">
            <div class="card-title">🧵 QR-код</div>
            <div class="qr-row">
                <div class="field">
                    <label>Ссылка на Яндекс.Форму</label>
                    <input id="formUrl" type="text" value="https://forms.yandex.ru/u/6a7f50ee02848f8f93df88e6/">
                </div>
                <div class="field">
                    <label>ID поля «№ партии»</label>
                    <input id="fieldId" type="text" value="partiya">
                </div>
            </div>
        </div>

        <!-- ===== СОЗДАНИЕ БИРКИ ===== -->
        <div class="card no-print">
            <div class="card-title">📋 Создание</div>
            <div class="field-group">
                <div class="field">
                    <label>№ партии</label>
                    <input id="fNum" type="text" placeholder="К-001">
                </div>
                <div class="field">
                    <label>Категория</label>
                    <select id="fCategory"><option value="">— выберите —</option></select>
                </div>
                <div class="field">
                    <label>Артикул</label>
                    <select id="fArticle"><option value="">— выберите —</option></select>
                </div>
                <div class="field">
                    <label>Размер</label>
                    <select id="fSize"><option value="">— выберите —</option></select>
                </div>
                <div class="field">
                    <label>Кол-во</label>
                    <input id="fQty" type="number" value="1" min="1">
                </div>
                <button id="addBtn" style="margin-top:4px;">➕ Создать бирку</button>
            </div>
            <div id="previewInfo" style="font-size:13px; color:#7a8f7a; margin-top:8px; text-align:center;"></div>
        </div>

        <!-- ===== БИРКИ ===== -->
        <div class="list-title">🏷️ Бирки</div>
        <div id="empty" class="empty">Пока пусто — создайте бирки выше.</div>
        <div id="grid" class="grid"></div>

        <!-- ===== СПИСОК БИРОК ===== -->
        <div class="card no-print" style="margin-top:16px;">
            <div class="card-title">📋 Список</div>
            <div class="table-wrap">
                <table class="data-table" id="tagsTable">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Партия</th>
                            <th>Артикул</th>
                            <th>Размер</th>
                            <th>Кол-во</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tagsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ===== ФУТЕР ===== -->
        <div class="brand-footer no-print">Спецназ <span>22</span> · 2026</div>

        <!-- ===== МОДАЛКА РЕДАКТИРОВАНИЯ ===== -->
        <div class="edit-overlay hidden" id="editOverlay">
            <div class="edit-modal">
                <h3>✏️ Редактирование</h3>
                <div class="field-group">
                    <div class="field">
                        <label>№ партии</label>
                        <input id="editNum" type="text">
                    </div>
                    <div class="field">
                        <label>Категория</label>
                        <select id="editCategory"></select>
                    </div>
                    <div class="field">
                        <label>Артикул</label>
                        <select id="editArticle"></select>
                    </div>
                    <div class="field">
                        <label>Размер</label>
                        <select id="editSize"></select>
                    </div>
                    <div class="field">
                        <label>Кол-во</label>
                        <input id="editQty" type="number" min="1">
                    </div>
                    <div style="display:flex; gap:10px; margin-top:12px;">
                        <button class="success" id="saveEditBtn" style="flex:1;">💾 Сохранить</button>
                        <button class="secondary" id="cancelEditBtn" style="flex:1;">✕ Отмена</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  ДАННЫЕ
        // ============================================================
        let articles = [];
        let tags = [];
        let editIndex = -1;

        // ============================================================
        //  ОБНОВЛЕНИЕ СЧЁТЧИКОВ
        // ============================================================
        function updateCounters() {
            const articlesEl = document.getElementById('articlesCountDisplay');
            const tagsEl = document.getElementById('tagsCountDisplay');

            if (articles.length === 0) {
                articlesEl.textContent = '/ 0';
                articlesEl.className = 'data-count empty';
            } else {
                articlesEl.textContent = '/ ' + articles.length;
                articlesEl.className = 'data-count';
            }

            if (tags.length === 0) {
                tagsEl.textContent = '/ 0';
                tagsEl.className = 'data-count empty';
            } else {
                tagsEl.textContent = '/ ' + tags.length;
                tagsEl.className = 'data-count';
            }
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ ВЫПАДАЮЩИХ СПИСКОВ
        // ============================================================
        function updateAllSelects() {
            const catSelect = document.getElementById('fCategory');
            const categories = [...new Set(articles.map(a => a[0]).filter(Boolean))];

            catSelect.innerHTML = '<option value="">— выберите —</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);
            });

            catSelect.onchange = function() {
                const selectedCategory = this.value;
                const artSelect = document.getElementById('fArticle');
                updateArticlesByCategory(selectedCategory, artSelect);
                updatePreview();
            };

            const artSelect = document.getElementById('fArticle');
            updateArticlesByCategory('', artSelect);
            updateCounters();
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ АРТИКУЛОВ ПО КАТЕГОРИИ
        // ============================================================
        function updateArticlesByCategory(category, targetSelect) {
            const filtered = category ? articles.filter(a => a[0] === category) : articles;

            targetSelect.innerHTML = '<option value="">— выберите —</option>';
            filtered.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a[2];
                opt.textContent = a[2] + (a[3] ? ' — ' + a[3] : '');
                opt.dataset.sizes = a[4] || '';
                opt.dataset.name = a[3] || '';
                opt.dataset.category = a[0] || '';
                targetSelect.appendChild(opt);
            });

            targetSelect.onchange = function() {
                updateSizesForSelect(targetSelect);
            };

            if (targetSelect.value) {
                updateSizesForSelect(targetSelect);
            }
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ РАЗМЕРОВ
        // ============================================================
        function updateSizesForSelect(articleSelect) {
            let sizeSelect = null;
            if (articleSelect.id === 'fArticle') sizeSelect = document.getElementById('fSize');
            else if (articleSelect.id === 'editArticle') sizeSelect = document.getElementById('editSize');
            if (!sizeSelect) return;

            const selectedOption = articleSelect.options[articleSelect.selectedIndex];
            let sizes = [];
            if (selectedOption && selectedOption.dataset.sizes) {
                let sizesStr = selectedOption.dataset.sizes.replace(/;/g, ',');
                sizes = sizesStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
            }

            sizeSelect.innerHTML = '<option value="">— выберите —</option>';
            sizes.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sizeSelect.appendChild(opt);
            });
        }

        // ============================================================
        //  ЗАГРУЗКА АРТИКУЛОВ
        // ============================================================
        document.getElementById('articlesFile').addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const text = ev.target.result;
                const lines = text.split('\n').filter(line => line.trim());
                const result = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(';').map(s => s.trim().replace(/^"|"$/g, ''));
                    if (cols.length >= 4 && cols[2] && cols[2].trim()) {
                        const a = cols.slice(0, 7);
                        while (a.length < 7) a.push('');
                        result.push(a);
                    }
                }
                if (result.length) {
                    articles = result;
                    updateAllSelects();
                    updateCounters();
                } else {
                    alert('Не удалось загрузить артикулы. Проверьте формат CSV.');
                }
            };
            reader.readAsText(file, 'UTF-8');
        });

        // ============================================================
        //  СБРОС АРТИКУЛОВ
        // ============================================================
        document.getElementById('resetArticlesBtn').onclick = function() {
            if (articles.length > 0) {
                if (!confirm('Сбросить все артикулы?')) return;
            }
            articles = [];
            updateAllSelects();
            updateCounters();
        };

        // ============================================================
        //  ЗАГРУЗКА БИРОК
        // ============================================================
        document.getElementById('tagsFile').addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const text = ev.target.result;
                const lines = text.split('\n').filter(line => line.trim());
                const result = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(';').map(s => s.trim().replace(/^"|"$/g, ''));
                    if (cols.length >= 1 && cols[0]) {
                        result.push({
                            num: cols[0] || '',
                            category: cols[1] || '',
                            article: cols[2] || '',
                            articleName: cols[3] || '',
                            size: cols[4] || '',
                            qty: parseInt(cols[5]) || 1
                        });
                    }
                }
                if (result.length) {
                    tags = result;
                    renderAll();
                    updateCounters();
                } else {
                    alert('Не найдено бирок в файле.');
                }
            };
            reader.readAsText(file, 'UTF-8');
        });

        // ============================================================
        //  СБРОС БИРОК
        // ============================================================
        document.getElementById('resetTagsBtn').onclick = function() {
            if (tags.length > 0) {
                if (!confirm('Сбросить все бирки?')) return;
            }
            tags = [];
            renderAll();
            updateCounters();
        };

        // ============================================================
        //  QR
        // ============================================================
        function buildUrl(num) {
            const base = document.getElementById('formUrl').value.trim();
            const field = document.getElementById('fieldId').value.trim() || 'partiya';
            if (!base) return num;
            const sep = base.includes('?') ? '&' : '?';
            return base + sep + field + '=' + encodeURIComponent(num);
        }

        // ============================================================
        //  ПРЕВЬЮ
        // ============================================================
        function updatePreview() {
            const articleKey = document.getElementById('fArticle').value;
            const article = articles.find(a => a[2] === articleKey);
            const preview = document.getElementById('previewInfo');
            if (article) {
                preview.textContent = '📦 ' + article[3] + ' | Разм.: ' + article[4] + ' | Цена: ' + article[5] + ' руб.';
            } else {
                preview.textContent = '';
            }
        }
        document.getElementById('fArticle').addEventListener('change', updatePreview);

        // ============================================================
        //  ДОБАВЛЕНИЕ БИРКИ
        // ============================================================
        document.getElementById('addBtn').onclick = function() {
            const num = document.getElementById('fNum').value.trim();
            const category = document.getElementById('fCategory').value;
            const articleKey = document.getElementById('fArticle').value;
            const size = document.getElementById('fSize').value;
            const qty = parseInt(document.getElementById('fQty').value) || 1;

            if (!num) { alert('Введите номер партии!');
                document.getElementById('fNum').focus(); return; }
            if (!category) { alert('Выберите категорию!'); return; }
            if (!articleKey) { alert('Выберите артикул!'); return; }
            if (!size) { alert('Выберите размер!'); return; }

            if (tags.some(t => t.num === num)) {
                if (!confirm('Бирка ' + num + ' уже есть. Заменить?')) return;
                const idx = tags.findIndex(t => t.num === num);
                if (idx >= 0) tags.splice(idx, 1);
            }

            const article = articles.find(a => a[2] === articleKey);
            const articleName = article ? article[3] : '';

            tags.push({
                num,
                category,
                article: articleKey,
                articleName,
                size,
                qty
            });

            document.getElementById('fNum').value = '';
            document.getElementById('fNum').focus();
            renderAll();
            updateCounters();
        };

        document.getElementById('fNum').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addBtn').click();
        });

        // ============================================================
        //  УДАЛЕНИЕ
        // ============================================================
        function deleteTag(index) {
            if (!confirm('Удалить бирку ' + tags[index].num + '?')) return;
            tags.splice(index, 1);
            renderAll();
            updateCounters();
        }

        // ============================================================
        //  РЕДАКТИРОВАНИЕ
        // ============================================================
        function editTag(index) {
            editIndex = index;
            const tag = tags[index];
            document.getElementById('editNum').value = tag.num;

            const catSelect = document.getElementById('editCategory');
            const categories = [...new Set(articles.map(a => a[0]).filter(Boolean))];
            catSelect.innerHTML = '<option value="">— выберите —</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                if (cat === tag.category) opt.selected = true;
                catSelect.appendChild(opt);
            });

            const artSelect = document.getElementById('editArticle');
            catSelect.onchange = function() {
                const selectedCategory = this.value;
                updateArticlesByCategory(selectedCategory, artSelect);
                for (let i = 0; i < artSelect.options.length; i++) {
                    if (artSelect.options[i].value === tag.article) {
                        artSelect.selectedIndex = i;
                        updateSizesForSelect(artSelect);
                        break;
                    }
                }
            };

            updateArticlesByCategory(tag.category, artSelect);
            for (let i = 0; i < artSelect.options.length; i++) {
                if (artSelect.options[i].value === tag.article) {
                    artSelect.selectedIndex = i;
                    updateSizesForSelect(artSelect);
                    break;
                }
            }

            document.getElementById('editQty').value = tag.qty;
            document.getElementById('editOverlay').classList.remove('hidden');
        }

        document.getElementById('saveEditBtn').onclick = function() {
            if (editIndex < 0) return;
            const num = document.getElementById('editNum').value.trim();
            const category = document.getElementById('editCategory').value;
            const articleKey = document.getElementById('editArticle').value;
            const size = document.getElementById('editSize').value;
            const qty = parseInt(document.getElementById('editQty').value) || 1;

            if (!num) { alert('Введите номер партии!'); return; }
            if (!category) { alert('Выберите категорию!'); return; }
            if (!articleKey) { alert('Выберите артикул!'); return; }
            if (!size) { alert('Выберите размер!'); return; }

            if (tags.some((t, i) => i !== editIndex && t.num === num)) {
                if (!confirm('Бирка ' + num + ' уже есть. Заменить?')) return;
                const idx = tags.findIndex((t, i) => i !== editIndex && t.num === num);
                if (idx >= 0) tags.splice(idx, 1);
                if (idx < editIndex) editIndex--;
            }

            const article = articles.find(a => a[2] === articleKey);
            const articleName = article ? article[3] : '';

            tags[editIndex] = {
                num,
                category,
                article: articleKey,
                articleName,
                size,
                qty
            };

            document.getElementById('editOverlay').classList.add('hidden');
            renderAll();
            updateCounters();
        };

        document.getElementById('cancelEditBtn').onclick = function() {
            document.getElementById('editOverlay').classList.add('hidden');
        };

        // ============================================================
        //  ОТРИСОВКА
        // ============================================================
        function renderAll() {
            renderTags();
            renderTable();
        }

        function renderTags() {
            const grid = document.getElementById('grid');
            const empty = document.getElementById('empty');

            grid.innerHTML = '';
            empty.style.display = tags.length === 0 ? 'block' : 'none';

            tags.forEach((t, i) => {
                const card = document.createElement('div');
                card.className = 'tag';

                const del = document.createElement('button');
                del.className = 'del-tag';
                del.textContent = '✕';
                del.onclick = (e) => { e.stopPropagation();
                    deleteTag(i); };
                card.appendChild(del);

                const edit = document.createElement('button');
                edit.className = 'edit-tag';
                edit.textContent = '✎';
                edit.onclick = (e) => { e.stopPropagation();
                    editTag(i); };
                card.appendChild(edit);

                const qrBox = document.createElement('div');
                qrBox.className = 'qr';
                card.appendChild(qrBox);

                const info = document.createElement('div');
                info.className = 'info';
                let metaHtml = '';
                if (t.category) metaHtml += t.category + '<br>';
                if (t.article) metaHtml += t.article + '<br>';
                if (t.articleName) metaHtml += t.articleName + '<br>';
                if (t.size) metaHtml += 'Разм.: ' + t.size + '<br>';
                if (t.qty) metaHtml += 'Кол-во: ' + t.qty + ' шт.';

                metaHtml += '<br><span style="font-size:9px; color:#b5432a; font-weight:bold;">Спецназ 22</span>';

                info.innerHTML = '<div class="num">' + t.num + '</div><div class="meta">' + metaHtml +
                    '</div><div class="footer">ИП Климов И.М.</div>';
                card.appendChild(info);

                grid.appendChild(card);

                try {
                    new QRCode(qrBox, {
                        text: buildUrl(t.num),
                        width: 80,
                        height: 80,
                        colorDark: '#1c2b22',
                        colorLight: '#ffffff'
                    });
                } catch (e) {
                    qrBox.textContent = 'QR ошибка';
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tagsTableBody');
            tbody.innerHTML = '';

            if (tags.length === 0) {
                tbody.innerHTML =
                    '<tr><td colspan="6" style="text-align:center;color:#7a8f7a;padding:20px;">Нет бирок</td></tr>';
                return;
            }

            tags.forEach((t, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td>${i + 1}</td>
                        <td class="tag-num">${t.num}</td>
                        <td>${t.article}</td>
                        <td>${t.size || ''}</td>
                        <td>${t.qty}</td>
                        <td>
                            <button class="small info" onclick="editTag(${i})" style="width:auto;padding:4px 8px;font-size:12px;">✎</button>
                            <button class="small danger" onclick="deleteTag(${i})" style="width:auto;padding:4px 8px;font-size:12px;">✕</button>
                        </td>
                    `;
                tbody.appendChild(tr);
            });
        }

        // ============================================================
        //  ЭКСПОРТ
        // ============================================================
        document.getElementById('exportTagsBtn').onclick = function() {
            if (!tags.length) { alert('Нет бирок для экспорта'); return; }
            let csv = '№ партии;Категория;Артикул;Наименование;Размер;Кол-во\n';
            tags.forEach(t => {
                csv += [t.num, t.category, t.article, t.articleName, t.size, t.qty].join(';') + '\n';
            });
            downloadFile(csv, 'birki.csv', 'text/csv');
        };

        document.getElementById('exportExcelBtn').onclick = function() {
            if (!tags.length) { alert('Нет данных для отчёта'); return; }

            const data = [
                ['№', '№ партии', 'Категория', 'Артикул', 'Наименование', 'Размер', 'Кол-во']
            ];
            tags.forEach((t, i) => {
                data.push([
                    i + 1,
                    t.num,
                    t.category || '',
                    t.article,
                    t.articleName || '',
                    t.size || '',
                    t.qty
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [
                { wch: 5 }, { wch: 12 }, { wch: 15 }, { wch: 12 },
                { wch: 30 }, { wch: 10 }, { wch: 10 }
            ];
            XLSX.utils.book_append_sheet(wb, ws, 'Бирки');

            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'отчёт_бирки.xlsx';
            link.click();
        };

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob(['\uFEFF' + content], { type: mimeType + ';charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ============================================================
        //  PDF
        // ============================================================
        document.getElementById('pdfBtn').onclick = function() {
            if (!tags.length) {
                alert('Нет бирок для PDF!');
                return;
            }

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Бирки партий кроя</title>
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body {
                            font-family: 'Courier New', monospace;
                            background: white;
                            padding: 20px;
                        }
                        .grid {
                            display: grid;
                            grid-template-columns: repeat(4, 1fr);
                            gap: 15px;
                        }
                        .tag {
                            border: 2px solid #1c2b22;
                            border-radius: 4px;
                            padding: 15px;
                            text-align: center;
                            background: white;
                            break-inside: avoid;
                        }
                        .tag .qr {
                            margin: 0 auto 8px;
                            width: 90px;
                            height: 90px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        }
                        .tag .qr img { max-width: 100%; max-height: 100%; }
                        .tag .num {
                            font-family: Georgia, serif;
                            font-size: 18px;
                            font-weight: 700;
                            margin-bottom: 4px;
                        }
                        .tag .meta {
                            font-size: 11px;
                            line-height: 1.6;
                            color: #3d3d35;
                        }
                        .tag .footer {
                            font-size: 9px;
                            color: #999;
                            margin-top: 8px;
                            border-top: 1px solid #eee;
                            padding-top: 6px;
                        }
                        .tag .brand {
                            font-size: 10px;
                            color: #b5432a;
                            font-weight: bold;
                            margin-top: 4px;
                            display: block;
                        }
                        @media print {
                            body { padding: 10px; }
                            .grid { gap: 10px; }
                            .tag { break-inside: avoid; }
                        }
                    </style>
                </head>
                <body>
                    <h1 style="font-family: Georgia, serif; font-size: 22px; border-bottom: 3px solid #1c2b22; padding-bottom: 10px; margin-bottom: 20px;">
                        Бирки партий кроя
                    </h1>
                    <div class="grid">
            `);

            tags.forEach(t => {
                const qr = new QRCode(document.createElement('div'), {
                    text: buildUrl(t.num),
                    width: 90,
                    height: 90,
                    colorDark: '#1c2b22',
                    colorLight: '#ffffff'
                });
                const qrCanvas = qr._el.querySelector('canvas');
                const qrImage = qrCanvas.toDataURL('image/png');

                printWindow.document.write(`
                    <div class="tag">
                        <div class="qr"><img src="${qrImage}" alt="QR"></div>
                        <div class="num">${t.num}</div>
                        <div class="meta">
                            ${t.category ? 'Категория: ' + t.category + '<br>' : ''}
                            Артикул: ${t.article}<br>
                            ${t.articleName || ''}<br>
                            Размер: ${t.size || '-'}<br>
                            Кол-во: ${t.qty} шт.
                        </div>
                        <span class="brand">Спецназ 22</span>
                        <div class="footer">ИП Климов И.М.</div>
                    </div>
                `);
            });

            printWindow.document.write(`
                    </div>
                    <p style="margin-top: 20px; font-size: 12px; color: #999; text-align: center;">
                        Всего бирок: ${tags.length}
                    </p>
                    <script>
                        setTimeout(function() {
                            window.print();
                        }, 500);
                    <\/script>
                </body>
                </html>
            `);

            printWindow.document.close();
        };

        // ============================================================
        //  ПЕЧАТЬ
        // ============================================================
        document.getElementById('printBtn').onclick = () => {
            if (!tags.length) { alert('Нет бирок для печати'); return; }
            window.print();
        };

        // ============================================================
        //  ОЧИСТКА
        // ============================================================
        document.getElementById('clearBtn').onclick = () => {
            if (!tags.length) {
                alert('Бирки уже пусты.');
                return;
            }
            if (confirm('Удалить все бирки?')) {
                tags = [];
                renderAll();
                updateCounters();
            }
        };

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        articles = [];
        tags = [];
        updateAllSelects();
        renderAll();
        updatePreview();
        updateCounters();

        console.log('🧵 Спецназ 22 — универсальная версия');
        console.log('📊 Данные: Артикулы / 0, Бирки / 0');
    </script>
</body>
</html>
